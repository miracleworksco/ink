[package]
name = "ink-lang"
version.workspace = true
edition = "2024"
license = "MIT"
rust-version.workspace = true
repository.workspace = true
description = "ink's language: models as text expanded to fields, documents, claims, the registry and reader packages plug into, and load-time programming"

[dependencies]
ink-core.workspace = true
ink-kernel.workspace = true
ink-io.workspace = true
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
read-fonts = { version = "=0.46.0", default-features = false, features = ["std"] }
skrifa = { version = "=0.49.0", default-features = false, features = ["std"] }
harfrust = { version = "0.15", default-features = false, features = ["std"] }
unicode-properties = { version = "0.1", default-features = false, features = ["general-category"] }

[lints]
workspace = true
