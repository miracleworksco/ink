# The public repository's checks on every push and pull request. The kernel
# (kernel/): formatting, clippy, the release build and the tests, on Linux
# and macOS, on stable and on the oldest Rust the workspace supports (its
# rust-version). Clippy warnings fail only on the oldest. A second job, once
# on Linux, runs the slow validation `cargo test` leaves out:
# kernel/benchmarks/run.sh. One more checks the simulation packages (sim/, a
# workspace of their own on the kernel): formatting, clippy and their tests
# (sim/cpu-test.sh). No GPU, no network past crates.io and Ubuntu's
# packages.
name: ci

on:
  # Branches only: a release's tag is a commit main's push already checked.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: ${{ matrix.os }}, Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 1.95 is the workspace's rust-version (kernel/Cargo.toml). Keep the two the same.
        rust: ["1.95", stable]
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy
          rustup override set ${{ matrix.rust }}
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          key: ${{ matrix.rust }}
      - run: cargo fmt --all --check
      # Warnings fail on 1.95. On stable a new lint only warns.
      - run: cargo clippy --workspace --all-targets ${{ matrix.rust == '1.95' && '-- -D warnings' || '' }}
      - run: cargo build --release
      - run: cargo test

  validation:
    name: validation (benchmarks/run.sh)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kernel
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal
          rustup override set 1.95
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kernel
          key: validation
      - run: benchmarks/run.sh

  sim:
    name: sim (simulation packages, CPU)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          rustup toolchain install 1.95 --profile minimal --component rustfmt,clippy
          rustup override set 1.95
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sim
          key: sim
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ./cpu-test.sh --quick
